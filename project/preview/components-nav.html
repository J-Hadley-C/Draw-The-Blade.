<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-900);height:100%;}
  .wrap{padding:20px 0;}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-top:1px solid var(--ember-700);border-bottom:1px solid var(--ember-700);background:linear-gradient(180deg,var(--ink-900),var(--ink-850));}
  .logo{display:flex;flex-direction:column;align-items:flex-start;line-height:1;gap:2px;}
  .logo .w{font-family:var(--font-display);font-weight:900;font-size:16px;letter-spacing:.24em;color:var(--fg-1);}
  .logo .k{font-family:var(--font-brush);font-size:11px;color:var(--crimson-500);letter-spacing:.18em;}
  .links{display:flex;gap:28px;}
  .links a{font-family:var(--font-mono);font-size:11px;letter-spacing:.22em;color:var(--fg-2);text-decoration:none;text-transform:uppercase;}
  .links a.on{color:var(--ember-400);text-shadow:var(--glow-ember-sm);}
  .cta{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:8px 16px;border-radius:4px;background:var(--crimson-600);color:var(--bone-50);border:1px solid var(--crimson-700);box-shadow:var(--glow-crimson-sm);}
</style></head>
<body><div class="wrap">
<nav class="nav">
  <div class="logo"><div class="w">DOJO SABRE</div><div class="k">道場 剣</div></div>
  <div class="links">
    <a class="on">⛩ Showcase</a>
    <a>Codex</a>
    <a>Inscriptions</a>
    <a>About</a>
  </div>
  <button class="cta">Enter</button>
</nav>
</div></body></html>

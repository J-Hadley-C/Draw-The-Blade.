<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-900);height:100%;}
  .wrap{padding:22px 28px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .label{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--fg-3);text-transform:uppercase;width:130px;}
  .ic{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg-2);}
  .ic svg{width:22px;height:22px;}
  .rune{font-family:var(--font-brush);font-size:24px;color:var(--ember-400);width:36px;text-align:center;}
  .glyph{font-size:22px;color:var(--ember-400);width:36px;text-align:center;}
  h4{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--fg-2);margin:0;text-transform:uppercase;}
</style></head>
<body><div class="wrap">
<h4>Iconography · Lucide · Unicode runes · Brush kanji</h4>
<div class="row"><div class="label">lucide 1.5 stroke</div>
  <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 17.5 3-3m0 0 3-3m-3 3-3-3m3 3L21 8"/><path d="m2.5 2.5 15 15"/></svg></span>
  <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2v20M2 12h20"/></svg></span>
  <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2m0 16v2m10-10h-2M4 12H2m15.07-7.07-1.41 1.41M7.34 16.66l-1.41 1.41m0-12.72 1.41 1.41m9.32 9.32 1.41 1.41"/><circle cx="12" cy="12" r="4"/></svg></span>
  <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
  <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="4" height="16" x="6" y="4"/><rect width="4" height="16" x="14" y="4"/></svg></span>
</div>
<div class="row"><div class="label">unicode glyphs</div>
  <span class="glyph">⛩</span><span class="glyph">✦</span><span class="glyph">◈</span><span class="glyph">◆</span><span class="glyph">·</span><span class="glyph">→</span>
</div>
<div class="row"><div class="label">brush kanji</div>
  <span class="rune">道</span><span class="rune">場</span><span class="rune">剣</span><span class="rune">刃</span><span class="rune">影</span>
</div>
</div></body></html>

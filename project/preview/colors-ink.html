<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Colors · Ink</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-900);height:100%;}
  .wrap{padding:20px 24px;}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .sw{display:flex;flex-direction:column;gap:4px;}
  .chip{height:56px;border-radius:8px;border:1px solid var(--border);}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
  h4{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--fg-2);margin:0 0 10px;text-transform:uppercase;}
</style></head>
<body><div class="wrap">
<h4>Ink · Forge blacks</h4>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink-950)"></div><div class="name">ink 950</div><div class="hex">#070506</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">ink 900</div><div class="hex">#0d0a0b</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-850)"></div><div class="name">ink 850</div><div class="hex">#141011</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="name">ink 800</div><div class="hex">#1a1517</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">ink 700</div><div class="hex">#241d1f</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="name">ink 600</div><div class="hex">#332a2c</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="name">ink 500</div><div class="hex">#4a3e41</div></div>
</div>
</div></body></html>

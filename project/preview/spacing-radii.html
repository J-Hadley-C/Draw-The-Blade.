<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-900);height:100%;}
  .wrap{padding:20px 24px;}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
  .sw{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .box{width:64px;height:64px;background:var(--bg-card);border:1px solid var(--border);}
  .nm{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
  .v{font-family:var(--font-mono);font-size:9px;color:var(--fg-3);}
  h4{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--fg-2);margin:0 0 10px;text-transform:uppercase;}
</style></head>
<body><div class="wrap">
<h4>Corner radii</h4>
<div class="row">
  <div class="sw"><div class="box" style="border-radius:0"></div><div class="nm">r-0</div><div class="v">0</div></div>
  <div class="sw"><div class="box" style="border-radius:2px"></div><div class="nm">r-1</div><div class="v">2</div></div>
  <div class="sw"><div class="box" style="border-radius:4px"></div><div class="nm">r-2</div><div class="v">4</div></div>
  <div class="sw"><div class="box" style="border-radius:8px"></div><div class="nm">r-3</div><div class="v">8</div></div>
  <div class="sw"><div class="box" style="border-radius:12px"></div><div class="nm">r-4</div><div class="v">12</div></div>
  <div class="sw"><div class="box" style="border-radius:16px"></div><div class="nm">r-5 ★</div><div class="v">16 card</div></div>
  <div class="sw"><div class="box" style="border-radius:999px"></div><div class="nm">r-pill</div><div class="v">999</div></div>
</div>
</div></body></html>

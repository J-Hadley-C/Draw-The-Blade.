<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Type · Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-900);height:100%;}
  .wrap{padding:24px 28px;color:var(--fg-1);display:flex;flex-direction:column;gap:14px;}
  .spec{display:flex;flex-direction:column;gap:4px;}
  .meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--fg-3);text-transform:uppercase;}
  .h1{font-family:var(--font-display);font-weight:700;font-size:56px;letter-spacing:.06em;line-height:1.02;text-transform:uppercase;}
  .h2{font-family:var(--font-display);font-weight:600;font-size:34px;letter-spacing:.08em;line-height:1.1;text-transform:uppercase;}
  .h3{font-family:var(--font-serif);font-weight:500;font-size:20px;letter-spacing:.02em;}
  .rule{height:1px;background:var(--border);}
</style></head>
<body><div class="wrap">
  <div class="spec"><div class="meta">Display · Cinzel 700 · 56/1.02 · +60</div><div class="h1">Draw The Blade</div></div>
  <div class="rule"></div>
  <div class="spec"><div class="meta">H2 · Cinzel 600 · 34/1.1 · +80</div><div class="h2">Eleven Figures Circle</div></div>
  <div class="rule"></div>
  <div class="spec"><div class="meta">H3 · Noto Serif JP 500 · 20/1.3</div><div class="h3">The Ember Mendicant, No. 07</div></div>
</div></body></html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Spacing · Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-900);height:100%;}
  .wrap{padding:20px 24px;color:var(--fg-1);}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
  .label{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);width:64px;}
  .bar{height:14px;background:var(--crimson-600);border-radius:2px;box-shadow:var(--glow-crimson-sm);}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);}
  h4{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--fg-2);margin:0 0 10px;text-transform:uppercase;}
</style></head>
<body><div class="wrap">
<h4>Spacing scale · 4px base</h4>
<div class="row"><div class="label">--s-1</div><div class="bar" style="width:4px"></div><div class="px">4</div></div>
<div class="row"><div class="label">--s-2</div><div class="bar" style="width:8px"></div><div class="px">8</div></div>
<div class="row"><div class="label">--s-3</div><div class="bar" style="width:12px"></div><div class="px">12</div></div>
<div class="row"><div class="label">--s-4</div><div class="bar" style="width:16px"></div><div class="px">16</div></div>
<div class="row"><div class="label">--s-5</div><div class="bar" style="width:24px"></div><div class="px">24</div></div>
<div class="row"><div class="label">--s-6</div><div class="bar" style="width:32px"></div><div class="px">32</div></div>
<div class="row"><div class="label">--s-7</div><div class="bar" style="width:48px"></div><div class="px">48</div></div>
<div class="row"><div class="label">--s-8</div><div class="bar" style="width:64px"></div><div class="px">64</div></div>
<div class="row"><div class="label">--s-9</div><div class="bar" style="width:96px"></div><div class="px">96</div></div>
</div></body></html>

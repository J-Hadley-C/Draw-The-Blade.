<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Colors · Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-900);height:100%;}
  .wrap{padding:20px 24px;}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .tok{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-panel);}
  .chip{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);flex-shrink:0;}
  .meta{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--fg-1);}
  .use{font-family:var(--font-sans);font-size:10px;color:var(--fg-3);}
  h4{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--fg-2);margin:0 0 10px;text-transform:uppercase;}
</style></head>
<body><div class="wrap">
<h4>Semantic tokens</h4>
<div class="row">
  <div class="tok"><div class="chip" style="background:var(--bg)"></div><div class="meta"><div class="name">--bg</div><div class="use">page background</div></div></div>
  <div class="tok"><div class="chip" style="background:var(--bg-panel)"></div><div class="meta"><div class="name">--bg-panel</div><div class="use">panel / sidebar</div></div></div>
  <div class="tok"><div class="chip" style="background:var(--bg-card)"></div><div class="meta"><div class="name">--bg-card</div><div class="use">raised cards</div></div></div>
  <div class="tok"><div class="chip" style="background:var(--fg-1)"></div><div class="meta"><div class="name">--fg-1</div><div class="use">primary text</div></div></div>
  <div class="tok"><div class="chip" style="background:var(--fg-2)"></div><div class="meta"><div class="name">--fg-2</div><div class="use">secondary text</div></div></div>
  <div class="tok"><div class="chip" style="background:var(--fg-3)"></div><div class="meta"><div class="name">--fg-3</div><div class="use">caption / meta</div></div></div>
  <div class="tok"><div class="chip" style="background:var(--accent)"></div><div class="meta"><div class="name">--accent</div><div class="use">primary CTA</div></div></div>
  <div class="tok"><div class="chip" style="background:var(--gold)"></div><div class="meta"><div class="name">--gold</div><div class="use">runic accent</div></div></div>
</div>
</div></body></html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><title>Type · Kanji + Eyebrow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--ink-900);height:100%;}
  .wrap{padding:24px 28px;color:var(--fg-1);display:flex;flex-direction:column;gap:18px;}
  .meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--fg-3);text-transform:uppercase;}
  .brush{font-family:var(--font-brush);font-size:56px;line-height:1;color:var(--crimson-500);}
  .brush-gold{font-family:var(--font-brush);font-size:40px;line-height:1;color:var(--ember-500);}
  .eyebrow{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ember-400);}
  .code{font-family:var(--font-mono);font-size:13px;color:var(--ember-400);background:var(--ink-950);padding:3px 8px;border-radius:4px;border:1px solid var(--border);}
  .rule{height:1px;background:var(--border);}
  .row{display:flex;align-items:baseline;gap:24px;}
</style></head>
<body><div class="wrap">
  <div><div class="meta">Brush kanji · Yuji Mai</div>
    <div class="row"><div class="brush">道場 剣</div><div class="brush-gold">影刃</div></div>
  </div>
  <div class="rule"></div>
  <div><div class="meta">Eyebrow · JetBrains Mono 500 · 11/.24em</div>
    <div class="eyebrow">⛩ · chapter i · the entrance</div>
  </div>
  <div class="rule"></div>
  <div><div class="meta">Inline code / rune tag</div>
    <div class="row"><span class="code">--accent</span><span class="code">glow-crimson-md</span><span class="code">rotateY(45deg)</span></div>
  </div>
</div></body></html>

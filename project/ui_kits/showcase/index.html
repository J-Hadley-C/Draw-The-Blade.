<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khen Fu · Showcase</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--ink-900); color: var(--fg-1); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="../config.js"></script>
<script src="../beatData.js"></script>
<script type="text/babel" src="../LicenceModal.jsx"></script>
<script type="text/babel" src="../AudioPlayer.jsx"></script>
<script type="text/babel" src="Carousel3D.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="FigureRail.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
  const App = () => {
    const [playing, setPlaying] = React.useState(null);
    const [beats, setBeats]     = React.useState([]);
    const [buyBeat, setBuyBeat] = React.useState(null);

    React.useEffect(() => {
      window.loadBeats().then(setBeats).catch(console.error);
    }, []);

    return (
      <>
        <Nav active="showcase" />
        <Hero setPlaying={setPlaying} beats={beats} />
        <FigureRail setPlaying={setPlaying} beats={beats} />
        <Footer />
        <AudioPlayer beat={playing} onClose={() => setPlaying(null)} onBuy={setBuyBeat} />
        <LicenceModal beat={buyBeat} onClose={() => setBuyBeat(null)} />
      </>
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

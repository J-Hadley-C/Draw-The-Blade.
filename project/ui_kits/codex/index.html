<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khen Fu · Catalogue</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--ink-900); color: var(--fg-1); height: 100%; }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  #root { display: flex; flex-direction: column; min-height: 100vh; }
  .app-body { display: flex; flex: 1; min-height: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="../beatData.js"></script>
<script type="text/babel" src="../AudioPlayer.jsx"></script>
<script type="text/babel" src="CodexNav.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="FigureGrid.jsx"></script>
<script type="text/babel" src="FigureDetail.jsx"></script>

<script type="text/babel">
  const App = () => {
    const [genre, setGenre]       = React.useState('All');
    const [search, setSearch]     = React.useState('');
    const [beats, setBeats]       = React.useState([]);
    const [selected, setSelected] = React.useState(null);
    const [playing, setPlaying]   = React.useState(null);

    React.useEffect(() => {
      window.loadBeats().then(loaded => {
        setBeats(loaded);
        setSelected(loaded[3] || loaded[0] || null);
      }).catch(console.error);
    }, []);

    const filtered = React.useMemo(() => {
      let list = beats;
      if (genre !== 'All') list = list.filter(b => b.genre === genre);
      if (search.trim()) {
        const q = search.toLowerCase();
        list = list.filter(b =>
          b.title.toLowerCase().includes(q) ||
          b.genre.toLowerCase().includes(q) ||
          String(b.bpm).includes(q) ||
          b.key.toLowerCase().includes(q)
        );
      }
      return list;
    }, [genre, search, beats]);

    return (
      <>
        <CodexNav search={search} setSearch={setSearch} />
        <div className="app-body">
          <Sidebar genre={genre} setGenre={setGenre} beats={beats} />
          <FigureGrid
            genre={genre}
            beats={filtered}
            selected={selected}
            setSelected={setSelected}
            setPlaying={setPlaying}
          />
          <FigureDetail
            figure={selected}
            onClose={() => setSelected(null)}
            setPlaying={setPlaying}
          />
        </div>
        <AudioPlayer beat={playing} onClose={() => setPlaying(null)} />
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

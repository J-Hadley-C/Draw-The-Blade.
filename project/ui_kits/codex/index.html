<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dojo Sabre · Codex</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--ink-900);
    color: var(--fg-1); height: 100%; }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  #root { display: flex; flex-direction: column; min-height: 100vh; }
  .app-body { display: flex; flex: 1; min-height: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root" data-screen-label="Codex · Figure Index"></div>

<script src="codexData.js"></script>
<script type="text/babel" src="CodexNav.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="FigureGrid.jsx"></script>
<script type="text/babel" src="FigureDetail.jsx"></script>

<script type="text/babel">
  const App = () => {
    const [clan, setClan] = React.useState('All');
    const [selected, setSelected] = React.useState(window.CODEX_FIGURES[3]);
    return (
      <>
        <CodexNav />
        <div className="app-body">
          <Sidebar clan={clan} setClan={setClan} />
          <FigureGrid clan={clan} selected={selected} setSelected={setSelected} />
          <FigureDetail figure={selected} onClose={() => setSelected(null)} />
        </div>
      </>
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
